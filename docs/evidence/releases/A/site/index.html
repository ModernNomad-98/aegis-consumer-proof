<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Checklist</h1>
      <p class="intro">A small checklist. Add an item, mark it complete, or delete it. Your items stay in this browser.</p>
    </header>

    <form id="new-item-form" class="new-item" novalidate>
      <label for="new-label">New item</label>
      <div class="new-item-row">
        <input id="new-label" name="label" type="text" autocomplete="off" maxlength="200" placeholder="What needs doing?">
        <button type="submit">Add</button>
      </div>
    </form>

    <p id="error" class="error" role="alert" hidden></p>
    <p id="notice" class="notice" role="status" hidden></p>

    <section id="storage-error" class="storage-error" aria-labelledby="storage-error-heading" hidden>
      <h2 id="storage-error-heading">Saved data could not be read</h2>
      <p id="storage-error-text"></p>
      <p>The original bytes are left unchanged at the storage key below. Copy them before resetting if you need them.</p>
      <p class="storage-key">Storage key: <code>checklist.state.v1</code></p>
      <pre id="raw-data" class="raw-data" tabindex="0"></pre>
      <button id="reset-storage" type="button" class="reset">Reset saved data</button>
    </section>

    <ul id="items" class="items" aria-label="Checklist items"></ul>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
